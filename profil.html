<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/user.css">
<title>Profil | LensaKita Studio</title>
</head>
<body data-root="../">
<header class="site-header" id="site-header"></header>
<nav class="subnav"><div class="container"><a href="dashboard.html">Dashboard</a><a href="booking.html">Booking</a><a href="riwayat.html">Riwayat</a><a href="profil.html">Profil</a></div></nav>
<main class="container user-wrap">

<h1 style="font-size:2.4rem;margin-bottom:20px">Profil saya</h1>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
<form class="panel" id="profileForm" novalidate><h2>Data akun</h2>
  <div class="alert" id="msgProfile" role="alert"></div>
  <label for="pUser">Username</label><input id="pUser" disabled>
  <label for="pName">Nama lengkap</label><input id="pName" required>
  <label for="pEmail">Email</label><input type="email" id="pEmail" required>
  <label for="pPhone">Nomor WhatsApp</label><input id="pPhone" required>
  <button class="btn" type="submit">Simpan Profil</button></form>
<form class="panel" id="passForm" novalidate><h2>Ganti password</h2>
  <div class="alert" id="msgPass" role="alert"></div>
  <label for="oldPass">Password lama</label><input type="password" id="oldPass" autocomplete="current-password" required>
  <label for="newPass">Password baru</label><input type="password" id="newPass" autocomplete="new-password" required>
  <label for="newPass2">Ulangi password baru</label><input type="password" id="newPass2" autocomplete="new-password" required>
  <button class="btn" type="submit">Ganti Password</button></form>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/main.js"></script>
<script src="../js/booking.js"></script>
</body>
</html>
