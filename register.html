<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<title>Register | LensaKita Studio</title>
</head>
<body data-root="">
<header class="site-header" id="site-header"></header>
<main class="container">
  <form class="form-box" id="regForm" novalidate>
    <h2>Buat akun pelanggan</h2>
    <div class="alert alert-error" id="msg" role="alert"></div>
    <label for="name">Nama lengkap</label><input id="name" required>
    <label for="username">Username</label><input id="username" autocomplete="username" required>
    <label for="email">Email</label><input type="email" id="email" required>
    <label for="phone">Nomor WhatsApp</label><input id="phone" placeholder="08123456789" required>
    <label for="password">Password</label><input type="password" id="password" autocomplete="new-password" required>
    <label for="password2">Ulangi password</label><input type="password" id="password2" autocomplete="new-password" required>
    <button class="btn" type="submit">Daftar</button>
    <p class="muted">Sudah punya akun? <a href="login.html">Login</a></p>
  </form>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/main.js"></script>
<script>
document.getElementById('regForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const v = id => document.getElementById(id).value;
  const r = Auth.register({name:v('name'), username:v('username'), email:v('email'), phone:v('phone'), password:v('password'), password2:v('password2')});
  const msg = document.getElementById('msg');
  if (!r.ok) { msg.textContent = r.msg; msg.classList.add('show'); return; }
  alert('Registrasi berhasil. Silakan login.');
  location.href = 'login.html';
});
</script>
</body>
</html>
