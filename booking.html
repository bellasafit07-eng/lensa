<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/user.css">
<title>Booking | LensaKita Studio</title>
</head>
<body data-root="../">
<header class="site-header" id="site-header"></header>
<nav class="subnav"><div class="container"><a href="dashboard.html">Dashboard</a><a href="booking.html">Booking</a><a href="riwayat.html">Riwayat</a><a href="profil.html">Profil</a></div></nav>
<main class="container user-wrap">

<h1 style="font-size:2.4rem;margin-bottom:20px">Booking layanan</h1>
<div class="book-grid">
<form class="panel" id="bookingForm" novalidate>
  <div class="alert" id="msg" role="alert"></div>
  <label for="bCat">Kategori</label><select id="bCat"></select>
  <label for="bSvc">Layanan</label><select id="bSvc"></select>
  <label for="bPkg">Paket</label><select id="bPkg"></select>
  <div class="row2"><div><label for="bDate">Tanggal</label><input type="date" id="bDate" required></div>
  <div><label for="bTime">Jam</label><input type="time" id="bTime" min="06:00" max="22:00" value="09:00" required></div></div>
  <label for="bLoc">Lokasi acara atau pemotretan</label><input id="bLoc" placeholder="Contoh: Aula Kampus, Jl. Merdeka 5" required>
  <label for="bWa">Nomor WhatsApp</label><input id="bWa" placeholder="08123456789" required>
  <label for="bNote">Catatan tambahan (opsional)</label><textarea id="bNote" rows="3"></textarea>
  <button class="btn" type="submit" id="btnBook">Konfirmasi Pesanan</button>
</form>
<aside class="panel summary" id="summary"></aside>
</div>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="../js/storage.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/main.js"></script>
<script src="../js/booking.js"></script>
</body>
</html>
